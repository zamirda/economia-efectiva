name: Integración Continua

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: clave-de-prueba-solo-para-ci
      DEBUG: "0"

    defaults:
      run:
        working-directory: economia-efectiva-django

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: economia-efectiva-django/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Revisar el proyecto (manage.py check)
        run: python manage.py check

      - name: Recolectar estáticos
        run: python manage.py collectstatic --noinput

      - name: Probar que la página y /salud/ responden
        run: |
          python - <<'PY'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "economia_efectiva.settings")
          django.setup()
          from django.test import Client

          c = Client(HTTP_HOST="localhost")
          for ruta in ("/salud/", "/"):
              r = c.get(ruta)
              print(ruta, "->", r.status_code)
              assert r.status_code == 200, f"{ruta} devolvió {r.status_code}"
          PY

  docker-build:
    runs-on: ubuntu-latest
    needs: build-check

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t economia-efectiva ./economia-efectiva-django

      - name: Arrancar el contenedor
        run: |
          docker run -d --name ee -p 8000:8000 \
            -e SECRET_KEY=clave-de-prueba-solo-para-ci \
            economia-efectiva

      - name: Esperar a que responda /salud/
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/salud/; then
              echo
              echo "==> El contenedor responde
